apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-app-ingress
  annotations:
    # Use the annotation specific to your Ingress Controller if needed.
    # For NGINX Ingress Controller, this is often used for path rewrites:
    # nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  # Specify the Ingress Class to link this Ingress to a specific Controller
  # Replace 'nginx' with the class name of your installed controller.
  ingressClassName: nginx
  rules:
  - host: student-app.example.com  # <-- Replace with your FQDN
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: student-service # <-- Name of your student-app Service
            port:
              number: 80              # <-- Port of your student-app Service