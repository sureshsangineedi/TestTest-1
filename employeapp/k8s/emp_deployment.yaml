
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emp-app
  template:
    metadata:
      labels:
        app: emp-app
    spec:
      containers:
      - name: emp-app
        image: rajuprudhvi/employappimag:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: emp-service
spec:
  type: NodePort
  selector:
    app: emp-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30006

